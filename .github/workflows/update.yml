name: Оновлення графіка

on:
  schedule:
    - cron: '*/15 * * * *'   # кожні 15 хв (GitHub інколи запізнюється на кілька хвилин)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Забрати графік
        env:
          GROUP: '7.1'
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
        run: node fetch.mjs
      - name: Зберегти, якщо змінився
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name  "svitlo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "графік $(TZ=Europe/Kyiv date '+%d.%m %H:%M')"
            git push
          fi
